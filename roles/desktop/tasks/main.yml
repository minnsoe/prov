---
- name: Ensure desktop utility casks installed
  community.general.homebrew_cask:
    name:
      # app launcher
      - alfred
      # terminal emulator
      - alacritty
    state: present
  when: is_darwin

- name: Ensure productivity casks installed
  community.general.homebrew_cask:
    name:
      - todoist
      - fantastical
    state: present
  when: is_darwin
